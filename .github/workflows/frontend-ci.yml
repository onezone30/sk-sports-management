name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Architecture rules (FSD layers, public APIs)
        run: npm run lint:arch

      # `npm run lint` is intentionally not gated here yet — it currently
      # fails on pre-existing errors unrelated to FSD (see frontend/CLAUDE.md
      # Implementation Status). Add it back once those are cleaned up.

      - name: Build
        run: npm run build
